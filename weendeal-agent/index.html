<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGO · UI custom</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "@useago/sdk": "https://esm.sh/@useago/sdk@0.4.3",
          "@useago/sdk/": "https://esm.sh/@useago/sdk@0.4.3/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>AGO</h1>
        <span class="status" id="status">prêt</span>
        <button type="button" id="new-chat" class="ghost">
          Nouvelle discussion
        </button>
      </header>
      <div id="log"></div>
      <form id="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Écris un message…"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send">Envoyer</button>
      </form>
    </div>

    <!-- The dev-panel is mounted here only when DEV is on. -->

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
