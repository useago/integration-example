<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
      {
        "imports": {
          "@useago/sdk/widget": "https://esm.sh/@useago/sdk@1.0.10/widget",
          "@useago/sdk/devtools": "https://esm.sh/@useago/sdk@1.0.10/devtools"
        }
      }
    </script>
    <title>AGO · Weendeal (widget intégrable)</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        height: 100dvh; /* track the visible viewport (mobile browser chrome / keyboard) */
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Each AGO widget mounts in a .chat-box; this frames + clips it as a card. */
      .chat-box {
        flex: 1 1 0;
        max-width: 600px;
        height: min(840px, 100%);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(28, 43, 74, 0.16);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* let the widget's root fill the box so its stream scrolls internally */
      .chat-box > * {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }

      /* Theme the AGO widget (CSS-variable way; the JS `theme:` block is the other) */
      .ago-chat-widget {
        --ago-font: inherit; /* adopt the page's Segoe UI stack */
        --ago-radius: 16px;
        --ago-brand-color: #2b7fff; /* user bubbles + send button */
        --ago-brand-text-color: #ffffff;
        --ago-header-background: #1c2b4a; /* deep brand header */
        --ago-header-text-color: #eaf1ff;
        --ago-text-color: #2a3550;
        --ago-border-color: #e3e7ee; /* hairlines */
        --ago-accent-color: #2b7fff; /* source badges + reply hover */
        --ago-messages-background: #f6f8fc; /* soft tint behind the conversation */
      }

      @media (max-width: 700px) {
        /* Stack the widgets full-width and let the page scroll between them */
        body {
          flex-direction: column;
          height: auto;
          min-height: 100dvh;
          overflow: auto;
          gap: 0;
          padding: 0;
        }
        .chat-box {
          flex: none;
          width: 100%;
          max-width: none;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        .ago-chat-widget {
          --ago-radius: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- Each AGO widget owns everything inside its box (header, stream, input). -->
    <div class="chat-box" id="ago-chat"></div>
    <div class="chat-box" id="ago-chat-2"></div>

    <script type="module">
      import { mountChatWidget } from "@useago/sdk/widget";
      import { initDevPanel } from "@useago/sdk/devtools";

      const AGENT_ID = "credit2";

      const INTRO_GUIDE = `Bonjour, je suis une **IA experte en finance personnelle**.
      Je vais vous poser **quelques questions** pour connaître votre situation et voir comment **réduire vos mensualités**. Peut-on commencer ?`;

      const INTRO_LIBRE = `Bonjour, je suis une **IA experte en finance personnelle**.
      **Expliquez moi votre situation** et je vous guide pour baisser vos mensualités.`;

      const waitFunction = {
        name: "wait",
        description:
          "Marque une pause de N secondes. Appelle cet outil entre deux messages pour attendre avant d'envoyer le message suivant.",
        parameters: {
          type: "object",
          properties: {
            seconds: {
              type: "number",
              description: "Durée de l'attente en secondes (0 à 60).",
            },
          },
          required: ["seconds"],
        },
        handler: (args) => {
          const requested = Number(args.seconds) || 0;
          const waited = Math.min(Math.max(requested, 0), 60); // clamp 0–60s
          return new Promise((resolve) => {
            setTimeout(() => resolve({ ok: true, waited }), waited * 1000);
          });
        },
      };

      // ─── First widget (credit2) ───────────────────────────────────────
      const widget = mountChatWidget("#ago-chat", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: AGENT_ID,
        },
        // Per-agent thread cache so this widget never resumes the other widget's
        // conversation. The visitor id (`ago_widget_id`) stays shared on purpose.
        persistConversation: { threadKey: "ago_last_thread_credit2" },
        title: "Agent guidé",
        // The greeting is delivered as a streamed assistant message (see below), so
        // the empty state stays blank until it plays.
        welcomeMessage: "",
        placeholder: "Écris un message…",
        // iMessage-style bubbles on both sides (this also bubbles assistant
        // replies, so agentBubble is implied) and drop the header bar (the
        // .chat-box card already frames the widget).
        bubbleStyle: "imessage",
        showHeader: false,
        formSubmittedMessage:
          "Votre demande a bien été envoyée. Un conseiller vous contactera rapidement.",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],

        onFormSubmitted: ({ name, values, result }) => {
          console.log("[ago] form submitted:", name, { values, result });
        },
        onFormError: ({ name, values, error }) => {
          console.warn("[ago] form submission failed:", name, {
            values,
            error,
          });
        },
      });

      widget.client.registerFunction(waitFunction);

      function streamIntro(handle, text) {
        const client = handle.client;
        const id = `intro-${Date.now()}`;
        const base = {
          id,
          conversationId: "",
          role: "assistant",
          createdAt: new Date(),
        };

        // Seed an empty in-progress assistant message → shows the typing dots.
        client.eventEmitter.emit("message:answer-complete", {
          ...base,
          content: "",
          status: "IN_PROGRESS",
        });

        // Stream word by word so the text appears to be typed live.
        const tokens = text.match(/\S+\s*/g) ?? [text];
        let i = 0;
        const timer = setInterval(() => {
          if (i >= tokens.length) {
            clearInterval(timer);
            client.eventEmitter.emit("message:complete", {
              ...base,
              content: text,
              status: "DONE",
            });
            return;
          }
          client.eventEmitter.emit("message:chunk", {
            content: tokens[i],
            conversationId: "",
            messageId: id,
          });
          i++;
        }, 45);
      }

      // Greet the guided agent on a fresh visit (resuming a thread loads its
      // real history instead, so we skip the intro then).
      if (!widget.session?.getLastActiveThread()) {
        streamIntro(widget, INTRO_GUIDE);
      }

      // ─── Second widget (credit3) ──────────────────────────────────────
      const widget2 = mountChatWidget("#ago-chat-2", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: "credit3",
        },
        // Its own thread cache key, separate from the credit widget above.
        persistConversation: { threadKey: "ago_last_thread_credit3" },
        title: "Agent libre",
        welcomeMessage: "",
        placeholder: "Écris un message…",
        formSubmittedMessage:
          "Votre demande a bien été envoyée. Un conseiller vous contactera rapidement.",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],

        onFormSubmitted: ({ name, values, result }) => {
          console.log("[ago] form submitted:", name, { values, result });
        },
        onFormError: ({ name, values, error }) => {
          console.warn("[ago] form submission failed:", name, {
            values,
            error,
          });
        },
      });

      widget2.client.registerFunction(waitFunction);

      // Only greet on a fresh visit; when a previous thread is being resumed we
      // let its real history load instead of stacking the intro on top.
      if (!widget2.session?.getLastActiveThread()) {
        streamIntro(widget2, INTRO_LIBRE);
      }

      const DEV = new URLSearchParams(location.search).has("dev");
      if (DEV) {
        initDevPanel({
          client: widget.client,
          label: "Agent guidé (credit2)",
          side: "left",
        });
        initDevPanel({
          client: widget2.client,
          label: "Agent libre (credit3)",
          side: "right",
        });
      }
    </script>
  </body>
</html>
