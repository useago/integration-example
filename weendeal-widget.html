<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
      {
        "imports": {
          "@useago/sdk/widget": "https://esm.sh/@useago/sdk@0.4.7/widget",
          "@useago/sdk/devtools": "https://esm.sh/@useago/sdk@0.4.7/devtools"
        }
      }
    </script>
    <title>AGO · Weendeal (widget intégrable)</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The AGO widget mounts in #ago-chat; this frames + clips it as a centered card. */
      .chat-box {
        width: min(720px, 100%);
        height: min(840px, 100%);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(28, 43, 74, 0.16);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* let the widget's root fill the box so its stream scrolls internally */
      .chat-box > * {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }

      /* Theme the AGO widget (CSS-variable way; the JS `theme:` block is the other) */
      .ago-chat-widget {
        --ago-font: inherit; /* adopt the page's Segoe UI stack */
        --ago-radius: 16px;
        --ago-brand-color: #2b7fff; /* user bubbles + send button */
        --ago-brand-text-color: #ffffff;
        --ago-header-background: #1c2b4a; /* deep brand header */
        --ago-header-text-color: #eaf1ff;
        --ago-text-color: #2a3550;
        --ago-border-color: #e3e7ee; /* hairlines */
        --ago-accent-color: #2b7fff; /* source badges + reply hover */
        --ago-messages-background: #f6f8fc; /* soft tint behind the conversation */
      }

      @media (max-width: 700px) {
        /* Chat takes over the whole screen on mobile */
        body {
          padding: 0;
        }
        .chat-box {
          width: 100%;
          height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
        .ago-chat-widget {
          --ago-radius: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- The AGO widget owns everything inside #ago-chat (header, stream, input). -->
    <div class="chat-box" id="ago-chat"></div>

    <script type="module">
      import { mountChatWidget } from "@useago/sdk/widget";
      import { initDevPanel } from "@useago/sdk/devtools";

      // ─── Configuration ────────────────────────────────────────────────
      const AGENT_ID = "credit2";

      const CREDIT_SCHEMA = {
        type: "object",
        properties: {
          // ── 1. Informations sur votre logement ──
          locataire: {
            type: "string",
            description:
              "Le client est-il propriétaire de son logement. Valeurs : 1=Propriétaire, 2=Pas propriétaire",
            enum: ["1", "2"],
          },
          type_locataire: {
            type: "string",
            description:
              "Valeur: 1=Locataire, 2=Hébergé(e). (Si pas propriétaire)",
            enum: ["1", "2"],
            requiredWhen: {
              property: "locataire",
              value: "2",
            },
          },
          montant_votre_loyer: {
            type: "number",
            description:
              "Montant du loyer mensuel, en euros par mois. (Si locataire)",
            requiredWhen: {
              property: "type_locataire",
              value: "1",
            },
          },
          heberge_gratuit: {
            type: "string",
            description:
              "Par qui le client est hébergé. Valeurs : 1=Hébergé(e) par la famille, 2=Hébergé(e) par un tiers, 3=Logement de fonction. (Si hébergé)",
            enum: ["1", "2", "3"],
            requiredWhen: {
              property: "type_locataire",
              value: "2",
            },
          },
          // ── 2. Crédits immobiliers / crédits à la consommation ──
          nb_credit_conso: {
            type: "number",
            description:
              "Nombre de crédits à la consommation en cours. Valeurs : 0=0, 1=1, 2=2, 14=3 ou plus",
            enum: ["0", "1", "2", "14"],
          },
          montant_remboursements_mensuel_conso: {
            type: "number",
            description:
              "Montant total des remboursements mensuels des crédits conso, en euros par mois (si au moins 1 crédit conso)",
            requiredWhen: {
              property: "nb_credit_conso",
              op: ">=",
              value: "1",
            },
          },
          capitaux_restant_dus_conso: {
            type: "number",
            description:
              "Estimation du capital restant dû (CRD) sur les crédits conso, en euros (si au moins un crédit conso)",
            requiredWhen: {
              property: "nb_credit_conso",
              op: ">=",
              value: "1",
            },
          },
          nb_credit_immo: {
            type: "number",
            description:
              "Nombre de crédits immobiliers en cours. Valeurs : 0=0, 1=1, 2=2, 14=3 ou plus",
            enum: ["0", "1", "2", "14"],
          },
          montant_remboursements_mensuel_immo: {
            type: "number",
            description:
              "Montant total des remboursements mensuels des crédits immobiliers, en euros par mois (si au moins un crédit immo)",
            requiredWhen: {
              property: "nb_credit_immo",
              op: ">=",
              value: "1",
            },
          },
          capitaux_restant_dus_immo: {
            type: "number",
            description:
              "Estimation du capital restant dû (CRD) sur les crédits immobiliers, en euros (si au moins un crédit immo)",
            requiredWhen: {
              property: "nb_credit_immo",
              op: ">=",
              value: "1",
            },
          },
          estimation_patrimoine: {
            type: "number",
            description:
              "Valeur estimée du ou des biens immobiliers détenus par le client, en euros. (si au moins un crédit immo)",
            requiredWhen: {
              property: "nb_credit_immo",
              op: ">=",
              value: "1",
            },
          },
          optin_assurance_pret: {
            type: "string",
            description:
              "Indique si le client souhaite également renégocier son assurance de prêt pour faire des économies. Souhaite-t-il recevoir une évaluation gratuite ? Valeurs: Y=Oui, N=Non (si au moins un crédit immo)",
            enum: ["Y", "N"],
            requiredWhen: {
              property: "nb_credit_immo",
              op: ">=",
              value: "1",
            },
          },
          detail_projet: {
            type: "string",
            description:
              "Valeurs: 1=Renégocier uniquement le prêt immobilier, 2=Regrouper plusieurs prêts conso et immo, 3=Regrouper uniquement les prêts conso",
            enum: ["1", "2", "3"],
          },
          // ── 3. Besoin de trésorerie ──
          tresorie: {
            type: "number",
            description:
              "Optionnel. Montant de trésorerie supplémentaire désirée (nombre, €)",
          },
          // ── 4. Situation familiale ──
          situation_famille: {
            type: "string",
            description:
              "Situation familiale : Valeurs: 1=Célibataire, 2=Marié(e) 2=Pacsé(e), 3=En couple, 4=Séparé(e) 4=En instance de divorce, 5=Divorcé(e), 6=Veuf(ve)",
            enum: ["1", "2", "3", "4", "5", "6"],
          },
          // @todo quoi envoyer si 3 ou plus
          nbre_enfant: {
            type: "string",
            description:
              "Nombre d'enfants à charge. Valeurs: 0=0, 1=1, 2=2, 3=3 ou plus",
            enum: ["0", "1", "2", "3"],
          },
          profession: {
            type: "string",
            description:
              "Profession du client. Valeurs : 1=Salarié (non cadre), 2=Salarié (cadre), 3=Commerçant / Artisan, 4=Fonctionnaire, 8=Chef d'entreprise, 9=Profession libérale,  12=Retraité, 13=Sans emploi, 15=Autre",
            enum: ["1", "2", "3", "4", "8", "9", "12", "13", "15"],
          },
          contrat_travail: {
            type: "string",
            description:
              "Type de contrat de travail du client. Valeurs : 1=CDI, 2=CDD, 3=Intérimaire, 4=Saisonnier, 5=Travailleur Non Salarié, 7=Secteur Public, 8=Intermittent du spectacle, 9=Autre / Retraité(e). Valeurs possible selon profession: Salarié: 1, 2, 3; Fonctionnaire: 1, 2, 7; Chef d'entreprise: 1, 5; Autre: 1, 2, 3, 4, 8. (Ne s'applique pas aux autres profession)",
            enum: ["1", "2", "3", "4", "5", "7", "8", "9"],
            requiredWhen: {
              property: "profession",
              value: ["1", "2", "4", "8", "15"],
            },
          },
          anciennete: {
            type: "string",
            description:
              "Nombre de bilans comptables disponibles. Valeurs : 0=0, 1=1, 2=2, 3=3, 4=4 ou plus (si profession Commerçant/Artisan, Chef d'entreprise ou Profession libérale)",
            enum: ["0", "1", "2", "3", "4"],
            requiredWhen: {
              property: "profession",
              value: ["3", "8", "9"],
            },
          },
          // ── 6. Revenus ──
          salaire: {
            type: "number",
            description:
              "Revenus nets mensuels avant impôt hors primes du client, en euros par mois",
          },
          prime: {
            type: "number",
            description: "Primes annuelles du client, en euros par an",
            requiredWhen: {
              property: "profession",
              value: ["1", "2", "4"],
            },
          },

          autres_revenus: {
            type: "number",
            description:
              "Autres revenus mensuels du client (pensions, allocations, loyers perçus…), en euros par mois",
          },
          // ── 8. Informations complémentaires ──
          FICP: {
            type: "string",
            description:
              "Le client est-il fiché FICP (fiché à la Banque de France). Valeurs : 1=Oui, 2=Non",
            enum: ["1", "2"],
          },
          // ── 9. Co-emprunteur ──
          projet_seul: {
            type: "string",
            description:
              "Démarche faite seul ou avec un co-emprunteur. Valeurs : 1=Seul, 2=Avec un co-emprunteur",
            enum: ["1", "2"],
          },
          // Si project avec co-emprunteur
          cj_civilite: {
            type: "string",
            description:
              "Civilité du co-emprunteur. Valeurs : 1=Mr, 3=Mme (si co-emprunteur)",
            enum: ["1", "3"],
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          cj_nom: {
            type: "string",
            description: "Nom de famille du co-emprunteur (si co-emprunteur)",
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          cj_prenom: {
            type: "string",
            description: "Prénom du co-emprunteur (si co-emprunteur)",
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          cj_dob: {
            type: "string",
            description:
              "Date de naissance du co-emprunteur (format YYYY-MM-DD) (si co-emprunteur)",
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          cj_profession: {
            type: "string",
            description:
              "Profession du co-emprunteur. Valeurs : 1=Salarié (non cadre), 2=Salarié (cadre), 3=Commerçant / Artisan, 4=Fonctionnaire, 8=Chef d'entreprise, 9=Profession libérale,  12=Retraité, 13=Sans emploi, 15=Autre. (si co-emprunteur)",
            enum: ["1", "2", "3", "4", "8", "9", "12", "13", "15"],
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          cj_contrat_travail: {
            type: "string",
            description:
              "Type de contrat de travail du co-emprunteur. Valeurs : 1=CDI, 2=CDD, 3=Intérimaire, 4=Saisonnier, 5=Travailleur Non Salarié, 7=Secteur Public, 8=Intermittent du spectacle, 9=Autre / Retraité(e). Valeurs possible selon profession: Salarié: 1, 2, 3; Fonctionnaire: 1, 2, 7; Chef d'entreprise: 1, 5; Autre: 1, 2, 3, 4, 8. (Ne s'applique pas aux autres profession)",
            enum: ["1", "2", "3", "4", "5", "7", "8", "9"],
            requiredWhen: {
              property: "cj_profession",
              value: ["1", "2", "4", "8", "15"],
            },
          },
          cj_anciennete: {
            type: "string",
            description:
              "Nombre de bilans comptables disponibles du co-emprunteur. Valeurs : 0=0, 1=1, 2=2, 3=3, 4=4 ou plus (si profession co-emprunteur Commerçant/Artisan, Chef d'entreprise ou Profession libérale)",
            enum: ["0", "1", "2", "3", "4"],
            requiredWhen: {
              property: "cj_profession",
              value: ["3", "8", "9"],
            },
          },
          cj_salaire: {
            type: "number",
            description:
              "Revenus nets mensuels du co-emprunteur, en euros par mois (si co-emprunteur)",
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          cj_prime: {
            type: "number",
            description:
              "Primes annuelles du co-emprunteur, en euros par an (si co-emprunteur)",
            requiredWhen: {
              property: "cj_profession",
              value: ["1", "2", "4"],
            },
          },
          cj_autres_revenus: {
            type: "number",
            description:
              "Autres revenus mensuels du co-emprunteur, en euros par mois (si co-emprunteur)",
            requiredWhen: {
              property: "projet_seul",
              value: "2",
            },
          },
          // ── 11. Coordonnées personnelles ──
          civilite: {
            type: "string",
            description: "Civilité du client. Valeurs : 1=Mr, 3=Mme",
            enum: ["1", "3"],
          },
          nom: {
            type: "string",
            description: "Nom de famille du client (max 35 caractères)",
          },
          prenom: {
            type: "string",
            description: "Prénom du client (max 35 caractères)",
          },
          email: {
            type: "string",
            description:
              "Adresse email du client (email valide, max 40 caractères)",
          },
          dob: {
            type: "string",
            description: "Date de naissance du client (format YYYY-MM-DD)",
          },
          cp: { type: "string", description: "Code postal (5 chiffres)" },
          tel: {
            type: "string",
            description: "Numéro de téléphone du client (10 chiffres)",
          },

          // ── 12. Consentements ──
          newsletter: {
            type: "string",
            description:
              "Si le client accepte d'être contacté(e) par un conseiller expert, dans le cadre de sa demande conformément aux CGU, par mail et téléphone. Lien pour le CGU https://www.weendeal.com/fr/terms-of-service.html#partenaires Valeurs : Y=Oui, N=Non",
            enum: ["Y", "N"],
          },
        },
        required: [
          "locataire",
          "nb_credit_conso",
          "nb_credit_immo",
          "situation_famille",
          "nbre_enfant",
          "profession",
          "prime",
          "autres_revenus",
          "FICP",
          "projet_seul",
          "civilite",
          "nom",
          "prenom",
          "email",
          "dob",
          "cp",
          "tel",
        ],
      };

      const widget = mountChatWidget("#ago-chat", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: AGENT_ID,
        },
        persistConversation: true,
        title: "Rachat de crédits",
        welcomeMessage: `
      Reprenez en main votre **pouvoir d'achat** !

      Le rachat de crédit vous permet de rassembler vos prêts en un seul et de **diminuer vos mensualités** jusqu'à -60%.

      Je vais vous poser quelques questions pour préparer votre dossier, ensuite un conseiller expert vous contactera pour finaliser les détails.

      N'hésitez pas à me poser vos questions à tout moment.
      `,
        placeholder: "Écris un message…",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            schema: CREDIT_SCHEMA,
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],
      });

      // ─── Dev panel (opt-in via ?dev) ──────────────────────────────────
      // The widget installs the credit form collector on its client, so the panel
      // renders its live state and logs each update_credit call from just the client.
      const DEV = new URLSearchParams(location.search).has("dev");
      if (DEV) initDevPanel({ client: widget.client });
    </script>
  </body>
</html>
