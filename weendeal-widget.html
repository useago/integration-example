<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script type="importmap">
      {
        "imports": {
          "@useago/sdk/widget": "https://esm.sh/@useago/sdk@1.3.0/widget",
          "@useago/sdk/devtools": "https://esm.sh/@useago/sdk@1.3.0/devtools"
        }
      }
    </script>
    <title>CreditProx · Votre conseiller financier personnel</title>

    <style>
      :root {
        --brand: #377dff; /* CreditProx blue */
        --ink: #333333;
        --line: #eef1f5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        /* Fill the visible viewport and let the chat below own the rest. */
        min-height: 100vh;
        min-height: 100dvh; /* tracks mobile browser chrome / keyboard */
        display: flex;
        flex-direction: column;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }

      /* ─── Top bar: centered CreditProx logo ──────────────────────────── */
      .site-nav {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px 16px;
        background: #ffffff;
        border-bottom: 1px solid var(--line);
      }
      .site-logo {
        height: 36px;
        width: auto;
      }

      /* ─── Hero: holds the chat. Mobile-first (stacked) ───────────────── */
      .hero {
        flex: 1 1 auto;
        min-height: 0; /* allow the inner flex column to shrink and scroll */
        display: flex;
        background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%);
      }
      .hero-inner {
        width: 100%;
        max-width: 1120px;
        margin: 0 auto;
        padding: 16px 16px 18px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: 12px;
      }

      /* Sizing frame + mount target for the AGO widget (the widget renders its
         own rounded card inside). Mobile-first: a compact card; desktop overrides
         the size below. */
      #ago-chat {
        flex: none;
        width: 100%;
        height: clamp(240px, 42vh, 340px);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(28, 43, 74, 0.16);
      }

      /* Theme the AGO widget via its public --ago-* tokens. */
      .ago-chat-widget {
        --ago-font: inherit; /* adopt the page font */
        --ago-radius: 16px;
        --ago-brand-color: var(--brand);
        --ago-brand-text-color: #ffffff;
        --ago-text-color: #2a3550;
        --ago-border-color: #e3e7ee;
        --ago-accent-color: var(--brand);
        --ago-messages-background: #f6f8fc;
      }

      /* Wider message bubbles read better on narrow screens. */
      .ago-chat-widget .ago-message__content {
        max-width: 88%;
      }

      /* ─── "Analyse du dossier" overlay ───────────────────────────────── */
      .ago-analyze-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483002; /* above the SDK fullscreen sheet + its bar */
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(16, 26, 48, 0.55);
      }
      .ago-analyze-card {
        padding: 32px 36px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 24px 60px rgba(16, 26, 48, 0.3);
        text-align: center;
      }
      .ago-analyze-spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 18px;
        border: 4px solid #e3e7ee;
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: ago-spin 0.8s linear infinite;
      }
      .ago-analyze-title {
        font-size: 16px;
        font-weight: 600;
        color: #1c2b4a;
      }
      @keyframes ago-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Desktop: centered chat card ────────────────────────────────── */
      @media (min-width: 900px) {
        .site-nav {
          padding: 18px 24px;
        }
        .site-logo {
          height: 46px;
        }

        .hero {
          align-items: center;
        }
        .hero-inner {
          align-items: center;
          gap: 28px;
          padding: 40px 24px;
        }

        #ago-chat {
          width: 540px;
          max-width: 540px;
          height: min(880px, 86vh);
        }
      }

      /* ─── Mobile: bottom-anchor the compact card ──────────────────────
         The compact card size is the base #ago-chat rule; the compact→fullscreen
         morph is owned by the SDK (automatic on mobile). */
      @media (max-width: 899px) {
        .hero-inner {
          justify-content: flex-end;
        }
      }
    </style>
  </head>

  <body>
    <nav class="site-nav">
      <a href="#" aria-label="CreditProx">
        <img
          class="site-logo"
          src="https://static.devisprox.com/img/v2/image/weendeal/logotype/logo-weendeal/svg/couleur/logo_creditprox-b2c-nobaseline-400x80.svg"
          alt="CreditProx"
        />
      </a>
    </nav>

    <main class="hero">
      <div class="hero-inner">
        <!-- The AGO widget owns everything inside this box (stream + input). -->
        <div id="ago-chat"></div>
      </div>
    </main>

    <script type="module">
      import { mountChatWidget } from "@useago/sdk/widget";
      import { initDevPanel } from "@useago/sdk/devtools";

      const AGENT_ID = "credit2";

      const INTRO_GUIDE = `Bonjour, je suis une **IA experte en finance personnelle**.
        Je vais vous poser **quelques questions** pour connaître votre situation et voir comment **réduire vos mensualités**. Peut-on commencer ?`;

      function showAnalyzeOverlay() {
        const overlay = document.createElement("div");
        overlay.className = "ago-analyze-overlay";
        overlay.innerHTML = `
            <div class="ago-analyze-card" role="status" aria-live="polite">
              <div class="ago-analyze-spinner"></div>
              <div class="ago-analyze-title">Analyse de votre dossier…</div>
            </div>`;
        document.body.appendChild(overlay);
        return {
          close(onClosed) {
            overlay.remove();
            if (typeof onClosed === "function") onClosed();
          },
        };
      }

      const analyzeFunction = {
        name: "analyse_dossier",
        description: "Analyse le dossier",
        parameters: {
          type: "object",
          properties: {
            seconds: {
              type: "number",
              description: "Durée de l'attente en secondes (0 à 60).",
            },
          },
          required: ["seconds"],
        },
        handler: (args) => {
          const requested = Number(args.seconds) || 0;
          // No seconds given? Play a believable analysis (~3.5s) by default.
          const waited = Math.min(Math.max(requested || 3.5, 0.5), 60); // clamp 0.5–60s
          return new Promise((resolve) => {
            const overlay = showAnalyzeOverlay();
            setTimeout(() => {
              // Resolve only once the overlay is gone, so the AI's next message
              // never starts streaming while it is still on screen.
              overlay.close(() => resolve({ ok: true, waited }));
            }, waited * 1000);
          });
        },
      };

      const widget = mountChatWidget("#ago-chat", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: AGENT_ID,
        },
        height: "100%", // fill the #ago-chat frame (which sizes per breakpoint)
        title: "CreditProx",
        welcomeMessage: {
          message: INTRO_GUIDE,
          mode: "streaming",
          followUpReplies: [
            "Oui, avec plaisir !",
            "Explique-moi comment ça fonctionne.",
          ],
        },
        placeholder: "Écris un message…",
        bubbleStyle: "imessage",
        showHeader: false,
        // Logo shown in the SDK's mobile fullscreen bar.
        logoUrl:
          "https://static.devisprox.com/img/v2/image/weendeal/logotype/logo-weendeal/svg/couleur/logo_creditprox-b2c-nobaseline-400x80.svg",
        // Mobile full-screen is automatic; we only override the breakpoint so it
        // matches the host's @media (max-width:899px) compact-card rule.
        mobile: { breakpoint: 899 },
        formSubmittedMessage:
          "Votre demande a bien été envoyée. Un conseiller vous contactera rapidement.",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],

        onFormSubmitted: ({ name, values, result }) => {
          console.log("[ago] form submitted:", name, { values, result });
          if (result && result.url) {
            window.location.href = result.url;
          }
        },
        onFormError: ({ name, values, error }) => {
          console.warn("[ago] form submission failed:", name, {
            values,
            error,
          });
        },
      });

      widget.client.registerFunction(analyzeFunction);

      const DEV = new URLSearchParams(location.search).has("dev");
      if (DEV) {
        initDevPanel({
          client: widget.client,
          label: "Agent guidé (credit2)",
          side: "left",
        });
      }
    </script>
  </body>
</html>
