<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
      {
        "imports": {
          "@useago/sdk/widget": "https://esm.sh/@useago/sdk@1.0.8/widget",
          "@useago/sdk/devtools": "https://esm.sh/@useago/sdk@1.0.8/devtools"
        }
      }
    </script>
    <title>AGO · Weendeal (widget intégrable)</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        height: 100dvh; /* track the visible viewport (mobile browser chrome / keyboard) */
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The AGO widget mounts in #ago-chat; this frames + clips it as a centered card. */
      .chat-box {
        width: min(720px, 100%);
        height: min(840px, 100%);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(28, 43, 74, 0.16);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* let the widget's root fill the box so its stream scrolls internally */
      .chat-box > * {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }

      /* Theme the AGO widget (CSS-variable way; the JS `theme:` block is the other) */
      .ago-chat-widget {
        --ago-font: inherit; /* adopt the page's Segoe UI stack */
        --ago-radius: 16px;
        --ago-brand-color: #2b7fff; /* user bubbles + send button */
        --ago-brand-text-color: #ffffff;
        --ago-header-background: #1c2b4a; /* deep brand header */
        --ago-header-text-color: #eaf1ff;
        --ago-text-color: #2a3550;
        --ago-border-color: #e3e7ee; /* hairlines */
        --ago-accent-color: #2b7fff; /* source badges + reply hover */
        --ago-messages-background: #f6f8fc; /* soft tint behind the conversation */
      }

      @media (max-width: 700px) {
        /* Chat takes over the whole screen on mobile */
        body {
          padding: 0;
        }
        .chat-box {
          width: 100%;
          height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
        .ago-chat-widget {
          --ago-radius: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- The AGO widget owns everything inside #ago-chat (header, stream, input). -->
    <div class="chat-box" id="ago-chat"></div>

    <script type="module">
      import { mountChatWidget } from "@useago/sdk/widget";
      import { initDevPanel } from "@useago/sdk/devtools";

      // ─── Configuration ────────────────────────────────────────────────
      const AGENT_ID = "credit2";

      // Shown as a fake assistant message that streams in on load (see below),
      // so it reads as if the AI had already greeted the visitor.
      const INTRO_MESSAGE = `Reprenez en main votre **pouvoir d'achat** !

Le rachat de crédit vous permet de rassembler vos prêts en un seul et de **diminuer vos mensualités** jusqu'à -60%.

Je vais vous poser quelques questions pour préparer votre dossier, ensuite un conseiller expert vous contactera pour finaliser les détails.

N'hésitez pas à me poser vos questions à tout moment.`;

      const widget = mountChatWidget("#ago-chat", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: AGENT_ID,
        },
        persistConversation: true,
        title: "Rachat de crédits",
        // The greeting is delivered as a streamed assistant message instead of the
        // static welcome block, so the empty state stays blank until it plays.
        welcomeMessage: "",
        placeholder: "Écris un message…",
        formSubmittedMessage:
          "Votre demande a bien été envoyée. Un conseiller vous contactera rapidement.",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],

        onFormSubmitted: ({ name, values, result }) => {
          console.log("[ago] form submitted:", name, { values, result });
        },
        onFormError: ({ name, values, error }) => {
          console.warn("[ago] form submission failed:", name, {
            values,
            error,
          });
        },
      });

      // ─── Streamed greeting ────────────────────────────────────────────
      // Replay the intro as if the assistant had just typed it. The widget
      // renders from the client's streaming events (message:answer-complete →
      // message:chunk → message:complete), so we drive those directly: seed an
      // in-progress assistant bubble (typing dots), stream the text chunk by
      // chunk, then mark it done. No backend call and no user message involved.
      function streamIntro(text) {
        const client = widget.client;
        const id = `intro-${Date.now()}`;
        const base = { id, conversationId: "", role: "assistant", createdAt: new Date() };

        // Seed an empty in-progress assistant message → shows the typing dots.
        client.eventEmitter.emit("message:answer-complete", {
          ...base,
          content: "",
          status: "IN_PROGRESS",
        });

        // Stream word by word so the text appears to be typed live.
        const tokens = text.match(/\S+\s*/g) ?? [text];
        let i = 0;
        const timer = setInterval(() => {
          if (i >= tokens.length) {
            clearInterval(timer);
            client.eventEmitter.emit("message:complete", {
              ...base,
              content: text,
              status: "DONE",
            });
            return;
          }
          client.eventEmitter.emit("message:chunk", {
            content: tokens[i],
            conversationId: "",
            messageId: id,
          });
          i++;
        }, 45);
      }

      // Only greet on a fresh visit; when a previous thread is being resumed we
      // let its real history load instead of stacking the intro on top.
      if (!widget.session?.getLastActiveThread()) {
        streamIntro(INTRO_MESSAGE);
      }

      // ─── Dev panel (opt-in via ?dev) ──────────────────────────────────
      // The widget installs the credit form collector on its client, so the panel
      // renders its live state and logs each update_credit call from just the client.
      const DEV = new URLSearchParams(location.search).has("dev");
      if (DEV) initDevPanel({ client: widget.client });
    </script>
  </body>
</html>
