<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="importmap">
      {
        "imports": {
          "@useago/sdk/widget": "https://esm.sh/@useago/sdk@1.0.10/widget",
          "@useago/sdk/devtools": "https://esm.sh/@useago/sdk@1.0.10/devtools"
        }
      }
    </script>
    <title>AGO · Weendeal (widget intégrable)</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        height: 100dvh; /* track the visible viewport (mobile browser chrome / keyboard) */
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Each AGO widget mounts in a .chat-box; this frames + clips it as a card. */
      .chat-box {
        flex: 1 1 0;
        max-width: 600px;
        height: min(840px, 100%);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(28, 43, 74, 0.16);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      /* let the widget's root fill the box so its stream scrolls internally */
      .chat-box > * {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }

      /* Theme the AGO widget (CSS-variable way; the JS `theme:` block is the other) */
      .ago-chat-widget {
        --ago-font: inherit; /* adopt the page's Segoe UI stack */
        --ago-radius: 16px;
        --ago-brand-color: #2b7fff; /* user bubbles + send button */
        --ago-brand-text-color: #ffffff;
        --ago-header-background: #1c2b4a; /* deep brand header */
        --ago-header-text-color: #eaf1ff;
        --ago-text-color: #2a3550;
        --ago-border-color: #e3e7ee; /* hairlines */
        --ago-accent-color: #2b7fff; /* source badges + reply hover */
        --ago-messages-background: #f6f8fc; /* soft tint behind the conversation */
      }

      /* ─── "Analyse du dossier" overlay ─────────────────────────────── */
      .ago-analyze-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(16, 26, 48, 0.55);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        animation: ago-fade-in 0.3s ease forwards;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      .ago-analyze-overlay.ago-closing {
        animation: ago-fade-out 0.35s ease forwards;
      }
      .ago-analyze-card {
        width: min(360px, calc(100vw - 48px));
        padding: 36px 32px 32px;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 30px 70px rgba(16, 26, 48, 0.35);
        text-align: center;
        transform: translateY(12px) scale(0.96);
        animation: ago-pop-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .ago-analyze-doc {
        position: relative;
        width: 84px;
        height: 100px;
        margin: 0 auto 26px;
      }
      /* the document sheet */
      .ago-analyze-doc .sheet {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background: linear-gradient(160deg, #f6f8fc 0%, #ffffff 100%);
        border: 2px solid #e3e7ee;
        box-shadow: 0 6px 18px rgba(28, 43, 74, 0.12);
        overflow: hidden;
      }
      /* folded corner */
      .ago-analyze-doc .sheet::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 22px;
        height: 22px;
        background: #e3e7ee;
        clip-path: polygon(100% 0, 0 0, 100% 100%);
      }
      /* text lines on the document */
      .ago-analyze-doc .line {
        position: absolute;
        left: 14px;
        height: 6px;
        border-radius: 3px;
        background: #dde3ee;
      }
      .ago-analyze-doc .line.l1 { top: 22px; width: 38px; }
      .ago-analyze-doc .line.l2 { top: 38px; width: 52px; }
      .ago-analyze-doc .line.l3 { top: 54px; width: 46px; }
      .ago-analyze-doc .line.l4 { top: 70px; width: 54px; }
      /* the scanning beam sweeping over the document */
      .ago-analyze-doc .scan {
        position: absolute;
        left: 0;
        right: 0;
        height: 14px;
        background: linear-gradient(
          to bottom,
          rgba(43, 127, 255, 0) 0%,
          rgba(43, 127, 255, 0.45) 50%,
          rgba(43, 127, 255, 0) 100%
        );
        box-shadow: 0 0 12px 2px rgba(43, 127, 255, 0.5);
        animation: ago-scan 1.6s ease-in-out infinite;
      }
      /* magnifier orbiting the document */
      .ago-analyze-doc .glass {
        position: absolute;
        bottom: -10px;
        right: -12px;
        width: 38px;
        height: 38px;
        animation: ago-glass-float 1.6s ease-in-out infinite;
      }
      .ago-analyze-doc .glass::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 4px solid #2b7fff;
        background: rgba(43, 127, 255, 0.08);
      }
      .ago-analyze-doc .glass::after {
        content: "";
        position: absolute;
        top: 23px;
        left: 23px;
        width: 12px;
        height: 4px;
        border-radius: 3px;
        background: #2b7fff;
        transform: rotate(45deg);
        transform-origin: left center;
      }
      .ago-analyze-title {
        font-size: 17px;
        font-weight: 600;
        color: #1c2b4a;
        margin-bottom: 6px;
      }
      .ago-analyze-status {
        font-size: 13.5px;
        color: #6b7691;
        min-height: 18px;
        transition: opacity 0.2s ease;
      }
      /* progress bar */
      .ago-analyze-bar {
        margin-top: 22px;
        height: 6px;
        border-radius: 4px;
        background: #eef1f7;
        overflow: hidden;
      }
      .ago-analyze-bar > i {
        display: block;
        height: 100%;
        width: 30%;
        border-radius: 4px;
        background: linear-gradient(90deg, #2b7fff, #5fa0ff);
        animation: ago-indeterminate 1.4s ease-in-out infinite;
      }
      @keyframes ago-scan {
        0%   { top: 4px; }
        50%  { top: 82px; }
        100% { top: 4px; }
      }
      @keyframes ago-glass-float {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50%      { transform: translate(-6px, -8px) rotate(-8deg); }
      }
      @keyframes ago-indeterminate {
        0%   { transform: translateX(-120%); width: 35%; }
        50%  { width: 55%; }
        100% { transform: translateX(320%); width: 35%; }
      }
      @keyframes ago-fade-in {
        to { opacity: 1; }
      }
      @keyframes ago-fade-out {
        to { opacity: 0; }
      }
      @keyframes ago-pop-in {
        to { transform: translateY(0) scale(1); }
      }

      @media (max-width: 700px) {
        /* Stack the widgets full-width and let the page scroll between them */
        body {
          flex-direction: column;
          height: auto;
          min-height: 100dvh;
          overflow: auto;
          gap: 0;
          padding: 0;
        }
        .chat-box {
          flex: none;
          width: 100%;
          max-width: none;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        .ago-chat-widget {
          --ago-radius: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- Each AGO widget owns everything inside its box (header, stream, input). -->
    <div class="chat-box" id="ago-chat"></div>
    <div class="chat-box" id="ago-chat-2"></div>

    <script type="module">
      import { mountChatWidget } from "@useago/sdk/widget";
      import { initDevPanel } from "@useago/sdk/devtools";

      const AGENT_ID = "credit2";

      const INTRO_GUIDE = `Bonjour, je suis une **IA experte en finance personnelle**.
      Je vais vous poser **quelques questions** pour connaître votre situation et voir comment **réduire vos mensualités**. Peut-on commencer ?`;

      const INTRO_LIBRE = `Bonjour, je suis une **IA experte en finance personnelle**.
      **Expliquez moi votre situation** et je vous guide pour baisser vos mensualités.`;

      // ─── Custom client function: wait N seconds ───────────────────────
      // A client-side tool the agent can call to pause before continuing.
      // Handlers may be async, so we return a Promise that resolves via
      // setTimeout. The same definition is registered on both widgets below.

      // Full-screen "analyse du dossier" animation shown while the wait runs.
      // Returns a handle with .close() that fades the overlay out and removes it.
      function showAnalyzeOverlay(durationSeconds) {
        const overlay = document.createElement("div");
        overlay.className = "ago-analyze-overlay";
        overlay.innerHTML = `
          <div class="ago-analyze-card" role="status" aria-live="polite">
            <div class="ago-analyze-doc">
              <div class="sheet">
                <span class="line l1"></span>
                <span class="line l2"></span>
                <span class="line l3"></span>
                <span class="line l4"></span>
                <span class="scan"></span>
              </div>
              <span class="glass"></span>
            </div>
            <div class="ago-analyze-title">Analyse de votre dossier…</div>
            <div class="ago-analyze-status"></div>
            <div class="ago-analyze-bar"><i></i></div>
          </div>`;
        document.body.appendChild(overlay);

        // Cycle through reassuring status messages over the duration.
        const steps = [
          "Lecture de vos informations…",
          "Vérification de votre situation…",
          "Calcul des économies possibles…",
          "Préparation de votre solution…",
        ];
        const statusEl = overlay.querySelector(".ago-analyze-status");
        let i = 0;
        const tick = () => {
          statusEl.style.opacity = "0";
          setTimeout(() => {
            statusEl.textContent = steps[i % steps.length];
            statusEl.style.opacity = "1";
            i += 1;
          }, 180);
        };
        tick();
        const everyMs = Math.max((durationSeconds * 1000) / steps.length, 700);
        const timer = setInterval(tick, everyMs);

        return {
          close(onClosed) {
            clearInterval(timer);
            overlay.classList.add("ago-closing");
            setTimeout(() => {
              overlay.remove();
              if (typeof onClosed === "function") onClosed();
            }, 350);
          },
        };
      }

      const analyzeFunction = {
        name: "analyse_dossier",
        description:
          "Analyse le dossier",
        parameters: {
          type: "object",
          properties: {
            seconds: {
              type: "number",
              description: "Durée de l'attente en secondes (0 à 60).",
            },
          },
          required: ["seconds"],
        },
        handler: (args) => {
          const requested = Number(args.seconds) || 0;
          // No seconds given? Play a believable analysis (~3.5s) by default.
          const waited = Math.min(Math.max(requested || 3.5, 0.5), 60); // clamp 0.5–60s
          return new Promise((resolve) => {
            const overlay = showAnalyzeOverlay(waited);
            setTimeout(() => {
              // Resolve only once the overlay has fully faded out, so the AI's
              // next message never starts streaming while the animation is still
              // on screen.
              overlay.close(() => resolve({ ok: true, waited }));
            }, waited * 1000);
          });
        },
      };

      // ─── First widget (credit2) ───────────────────────────────────────
      const widget = mountChatWidget("#ago-chat", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: AGENT_ID,
        },
        // Per-agent thread cache so this widget never resumes the other widget's
        // conversation. The visitor id (`ago_widget_id`) stays shared on purpose.
        persistConversation: { threadKey: "ago_last_thread_credit2" },
        title: "Agent guidé",
        // The greeting is delivered as a streamed assistant message (see below), so
        // the empty state stays blank until it plays.
        welcomeMessage: "",
        placeholder: "Écris un message…",
        // iMessage-style bubbles on both sides (this also bubbles assistant
        // replies, so agentBubble is implied) and drop the header bar (the
        // .chat-box card already frames the widget).
        bubbleStyle: "imessage",
        showHeader: false,
        formSubmittedMessage:
          "Votre demande a bien été envoyée. Un conseiller vous contactera rapidement.",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],

        onFormSubmitted: ({ name, values, result }) => {
          console.log("[ago] form submitted:", name, { values, result });
        },
        onFormError: ({ name, values, error }) => {
          console.warn("[ago] form submission failed:", name, {
            values,
            error,
          });
        },
      });

      // Expose the `wait` tool to this widget's agent.
      widget.client.registerFunction(analyzeFunction);

      function streamIntro(handle, text) {
        const client = handle.client;
        const id = `intro-${Date.now()}`;
        const base = {
          id,
          conversationId: "",
          role: "assistant",
          createdAt: new Date(),
        };

        // Seed an empty in-progress assistant message → shows the typing dots.
        client.eventEmitter.emit("message:answer-complete", {
          ...base,
          content: "",
          status: "IN_PROGRESS",
        });

        // Stream word by word so the text appears to be typed live.
        const tokens = text.match(/\S+\s*/g) ?? [text];
        let i = 0;
        const timer = setInterval(() => {
          if (i >= tokens.length) {
            clearInterval(timer);
            client.eventEmitter.emit("message:complete", {
              ...base,
              content: text,
              status: "DONE",
            });
            return;
          }
          client.eventEmitter.emit("message:chunk", {
            content: tokens[i],
            conversationId: "",
            messageId: id,
          });
          i++;
        }, 45);
      }

      // Greet the guided agent on a fresh visit (resuming a thread loads its
      // real history instead, so we skip the intro then).
      if (!widget.session?.getLastActiveThread()) {
        streamIntro(widget, INTRO_GUIDE);
      }

      // ─── Second widget (credit3) ──────────────────────────────────────
      const widget2 = mountChatWidget("#ago-chat-2", {
        config: {
          baseUrl: window.AGO_BASE_URL ?? "https://weendeal.api.useago.com",
          agent: "credit3",
        },
        // Its own thread cache key, separate from the credit widget above.
        persistConversation: { threadKey: "ago_last_thread_credit3" },
        title: "Agent libre",
        welcomeMessage: "",
        placeholder: "Écris un message…",
        formSubmittedMessage:
          "Votre demande a bien été envoyée. Un conseiller vous contactera rapidement.",
        forms: [
          {
            name: "credit",
            description:
              "Demande de rachat / regroupement de crédits. Renseigne les champs au fur et à mesure ; ne redemande pas un champ déjà rempli.",
            initialValues: {
              rejets_3_derniers_mois: "2",
              pays: "FR",
            },
          },
        ],

        onFormSubmitted: ({ name, values, result }) => {
          console.log("[ago] form submitted:", name, { values, result });
        },
        onFormError: ({ name, values, error }) => {
          console.warn("[ago] form submission failed:", name, {
            values,
            error,
          });
        },
      });

      // Expose the `wait` tool to this widget's agent too.
      widget2.client.registerFunction(analyzeFunction);

      // Only greet on a fresh visit; when a previous thread is being resumed we
      // let its real history load instead of stacking the intro on top.
      if (!widget2.session?.getLastActiveThread()) {
        streamIntro(widget2, INTRO_LIBRE);
      }

      const DEV = new URLSearchParams(location.search).has("dev");
      if (DEV) {
        initDevPanel({
          client: widget.client,
          label: "Agent guidé (credit2)",
          side: "left",
        });
        initDevPanel({
          client: widget2.client,
          label: "Agent libre (credit3)",
          side: "right",
        });
      }
    </script>
  </body>
</html>
